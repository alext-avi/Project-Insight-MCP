# Default rules, plus hostnames this public repo must never contain.
[extend]
useDefault = true

[[rules]]
id = "pi-tenant-host"
description = "A Project Insight tenant hostname"
regex = '''[a-z0-9-]+\.projectinsight\.net'''
  [rules.allowlist]
  regexes = ['''\b(yourdomain|your-domain|your-tenant|your-company|example|api)\.projectinsight\.net''']

[[rules]]
id = "app-service-host"
description = "An Azure App Service or Functions hostname"
regex = '''[a-z0-9-]+\.azurewebsites\.net'''
  [rules.allowlist]
  regexes = ['''\b(your-function-app|your-function-app-name|your-app|example)\.azurewebsites\.net''']
