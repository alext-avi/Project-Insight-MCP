name: CI

# Builds both hosts and runs the tests, including the Table/Blob store tests against Azurite.
# Deployment is separate: deploy.yml arrives with the infrastructure (Part C).
on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        env:
            AZURITE_CONNECTION_STRING: UseDevelopmentStorage=true
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup .NET
              uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
              with:
                  dotnet-version: "10.0.x"

            # A step, not a service container: Azurite needs --skipApiVersionCheck for current Azure SDKs.
            - name: Start Azurite
              run: |
                  docker run -d --name azurite -p 10000-10002:10000-10002 mcr.microsoft.com/azure-storage/azurite:3.37.0 azurite --skipApiVersionCheck --loose --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
                  for port in 10000 10001 10002; do
                      for i in $(seq 1 30); do
                          (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && continue 2
                          sleep 1
                      done
                      echo "Azurite port $port not ready after 30s" >&2
                      docker logs azurite
                      exit 1
                  done

            # The tests project references core, server and both hosts, so this restores every project, each
            # against its packages.lock.json. Later steps don't restore again.
            - name: Restore (locked)
              run: dotnet restore servers/project-insight/tests --locked-mode

            - name: Build
              run: dotnet build servers/project-insight/tests --configuration Release --no-restore -warnaserror

            - name: Test
              run: dotnet test servers/project-insight/tests --configuration Release --no-build
              env:
                  # UTC+14: a PI expiry read in local time instead of UTC would be off by 14 hours, which UTC CI can't catch.
                  TZ: Pacific/Kiritimati
