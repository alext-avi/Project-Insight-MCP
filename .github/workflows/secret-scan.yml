name: Secret scan

# Scans the whole git history (not just the diff) for credentials with gitleaks, on every PR and
# every push to main. Merge commits are scanned against their first parent, so a secret added while
# resolving a conflict is caught too. The weekly run is a backstop for history that changed outside a
# PR (a force-push or a branch pushed directly); the gitleaks image is pinned by version and digest,
# so it does not pick up new detection rules until the pin below is bumped.
# Known false positives are listed by fingerprint in .gitleaksignore. Pull requests are scanned with the
# base branch's .gitleaks.toml and .gitleaksignore; pushes and scheduled runs use the checked-out ones.
on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  # .git is mounted into the gitleaks container; keep the token out of .git/config.
                  persist-credentials: false

            # A pull request is scanned with the base branch's rules and ignore list, so it can't weaken them, or
            # ignore its own finding, in the same change. Edits to these two files take effect once merged.
            - name: Use the base branch's gitleaks config
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  set -euo pipefail
                  base=$(git rev-parse --verify "refs/remotes/origin/$BASE_REF^{commit}")
                  for f in .gitleaks.toml .gitleaksignore; do
                      if git cat-file -e "$base:$f" 2>/dev/null; then
                          git show "$base:$f" > "$f"
                      else
                          rm -f "$f"
                      fi
                  done

            - name: Scan history
              run: >-
                  docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
                  git /repo --log-opts="--all --full-history --diff-merges=first-parent"
                  --redact --no-banner --exit-code 1
