name: Secret scan

# Scans the whole git history (not just the diff) for credentials with gitleaks, on every PR,
# every push to main, and weekly so new detection rules are applied to old commits.
# Known false positives are listed by fingerprint in .gitleaksignore.
on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Scan history
              run: >-
                  docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
                  git /repo --redact --no-banner --exit-code 1
