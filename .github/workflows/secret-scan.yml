name: Secret scan

# Scans the whole git history (not just the diff) for credentials with gitleaks, on every PR and
# every push to main. Merge commits are scanned against their first parent, so a secret added while
# resolving a conflict is caught too. The weekly run is a backstop for history that changed outside a
# PR (a force-push or a branch pushed directly); the gitleaks image is pinned by version and digest,
# so it does not pick up new detection rules until the pin below is bumped.
# Known false positives are listed by fingerprint in .gitleaksignore.
on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - name: Scan history
              run: >-
                  docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
                  git /repo --log-opts="--all --full-history --diff-merges=first-parent"
                  --redact --no-banner --exit-code 1
