version: 2

# Weekly version updates, grouped so each ecosystem opens at most a couple of PRs.
# Security updates are enabled in the repo settings and are not limited by the groups below.
updates:
    # Local stdio server (.NET 10), the shared MCP wiring, and the tests. Lock files are updated with them.
    - package-ecosystem: nuget
      directories:
          - "/servers/project-insight/src-stdio"
          - "/servers/project-insight/server"
          - "/servers/project-insight/tests"
      schedule:
          interval: weekly
      groups:
          minor-and-patch:
              update-types: [minor, patch]

    # Core, the shared MCP wiring's dependencies and the web host. Lock files are updated with them.
    - package-ecosystem: nuget
      directories:
          - "/servers/project-insight/core"
          - "/servers/project-insight/src-web"
      schedule:
          interval: weekly
      groups:
          minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]
