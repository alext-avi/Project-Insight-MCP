version: 2

# Weekly version updates, grouped so each ecosystem opens one PR across all its directories.
# Security updates are enabled in the repo settings and are not limited by the groups below.
updates:
    # Every .NET project in one entry, so a package used by several projects is bumped in one PR. Dependabot
    # updates only the bumped project's own lock file; dependabot-lock-refresh.yml then refreshes the lock files
    # of the projects that reference it. The stdio host has no lock file (single-file publish makes it
    # machine-specific).
    - package-ecosystem: nuget
      directories:
          - "/servers/project-insight/core"
          - "/servers/project-insight/server"
          - "/servers/project-insight/src-stdio"
          - "/servers/project-insight/src-web"
          - "/servers/project-insight/tests"
      schedule:
          interval: weekly
      # The repo's own tool, pinned in .config/dotnet-tools.json; it is released from here, not updated from NuGet.
      ignore:
          - dependency-name: "projectinsight.mcp"
          # These follow the .NET release the projects target (net10.0, and ASP.NET Core 10's shared framework), so
          # their major versions arrive with a move to the next .NET, not one package at a time.
          - dependency-name: "Microsoft.Extensions.*"
            update-types: ["version-update:semver-major"]
          - dependency-name: "Microsoft.AspNetCore.*"
            update-types: ["version-update:semver-major"]
      groups:
          # The MCP SDK's packages share one version (ModelContextProtocolVersion in Directory.Build.props), so they
          # update together, majors included. Dependabot doesn't reliably keep a dependency to the first group it
          # matches, so minor-and-patch excludes them explicitly.
          mcp-sdk:
              patterns: ["ModelContextProtocol*"]
          minor-and-patch:
              update-types: [minor, patch]
              exclude-patterns: ["ModelContextProtocol*"]

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]
